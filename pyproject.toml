[project]
name = "rfc-audit-agent"
version = "2.1.0"
description = "Autonomous LangGraph RFC Audit Agent for Educational Automated Grading"
authors = [{ name = "Audit Agent Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10.0",
    "requests>=2.31.0",
    "psutil>=7.0.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
